services:
  - type: web
    name: mockprep
    env: python
    buildCommand: pip install -r requirements.txt || pip install -r mockprep/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT || uvicorn mockprep.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0
